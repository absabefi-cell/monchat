<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b7d5a">
<title>MonChat</title>
<link rel="icon" href="icon.png">
</head>
<body style="font-family:sans-serif;text-align:center;padding:60px 20px;background:#0b7d5a;color:#fff">
<img src="icon.png" width="96" alt="">
<p id="m">Connexion au serveur...</p>
<script>
fetch('serveur.json?t=' + Date.now(), {cache: 'no-store'})
  .then(r => r.json())
  .then(d => location.replace(d.url))
  .catch(() => {
    document.getElementById('m').textContent = 'Serveur hors ligne. Réessaie plus tard.';
  });
</script>
</body>
</html>
