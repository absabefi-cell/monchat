<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MonChat V1</title><style>body{font:16px system-ui;background:#eef5f1;margin:0;color:#172b23}main{max-width:650px;margin:auto;padding:16px}header{background:#087c58;color:white;padding:18px;border-radius:14px}section{background:white;padding:16px;border-radius:14px;margin-top:14px}input,button{padding:12px;border-radius:9px;border:1px solid #bbb;margin:5px 0;box-sizing:border-box}input{width:100%}button{background:#087c58;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}#messages{height:240px;overflow:auto;background:#f5f8f6;padding:10px;white-space:pre-wrap}#videoGrid{display:flex;gap:8px}video{width:49%;background:black;border-radius:10px}small{color:#666}.hidden{display:none}.person{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding:9px 0}</style></head><body><main><header><h2>MonChat V1</h2><div id="status">Non connecté</div></header><section id="auth"><h3>Connexion / inscription</h3><input id="server" placeholder="Adresse du serveur, ex. http://192.168.1.10:3000"><input id="name" placeholder="Nom affiché (pour inscription)"><input id="username" placeholder="Pseudo unique"><input id="password" type="password" placeholder="Mot de passe (8 caractères minimum)"><button id="register">Créer un compte</button> <button id="login">Connexion</button><p id="authError"></p></section><section id="app" class="hidden"><button id="logout">Déconnexion</button><h3>Personnes connectées</h3><div id="people"></div><h3 id="conversation">Choisir une personne</h3><div id="messages"></div><input id="message" placeholder="Écrire un message"><button id="send">Envoyer</button><div><button id="audio">📞 Appel audio</button> <button id="video">📹 Appel vidéo</button> <button id="hangup">Raccrocher</button></div><p id="callStatus"></p><div id="videoGrid"><video id="localVideo" autoplay playsinline muted></video><video id="remoteVideo" autoplay playsinline></video></div></section></main><script>
const $=id=>document.getElementById(id);let ws,token='',me='',peer='',pc,localStream,callId='',pendingOffer=null,callMode='video';let worker=localStorage.getItem('monchat_local_server')||'http://';$('server').value=worker;
function setStatus(s){$('status').textContent=s}function error(e){$('authError').textContent=e.message||String(e)}
async function api(path,body){const url=$('server').value.trim().replace(/\/$/,'');if(!/^https?:\/\/[^/]+/i.test(url))throw Error('Entrer une adresse comme http://192.168.1.10:3000');localStorage.setItem('monchat_local_server',url);const r=await fetch(url+path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Erreur serveur');return j}
async function auth(kind){try{const r=await api('/api/'+kind,{username:$('username').value.trim().toLowerCase(),name:$('name').value.trim(),password:$('password').value});token=r.token;me=r.username;try{localStorage.setItem('mc_tok',token);localStorage.setItem('mc_me',me)}catch(e){}$('auth').classList.add('hidden');$('app').classList.remove('hidden');setStatus('Connecté : @'+me);connect()}catch(e){error(e)}}$('register').onclick=()=>auth('register');$('login').onclick=()=>auth('login');
function connect(){if(ws)ws.close();const base=$('server').value.trim().replace(/\/$/,'').replace(/^http/,'ws');ws=new WebSocket(base+'/ws?token='+encodeURIComponent(token));ws.onopen=()=>setStatus('🟢 Connecté : @'+me);ws.onclose=()=>{setStatus('Connexion interrompue');$('people').textContent='Connexion perdue';if(token)setTimeout(connect,3500)};ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='presence')renderPeople(m.users);if(m.type==='chat'&&m.from===peer)addMessage(m.from,m.text);if(m.type==='signal')await signal(m);if(m.type==='error')$('callStatus').textContent=m.error}}function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}
function renderPeople(users){$('people').replaceChildren();for(const u of users.filter(x=>x.username!==me)){const d=document.createElement('div');d.className='person';const label=document.createElement('span');label.textContent='🟢 '+u.name+' (@'+u.username+')';const b=document.createElement('button');b.textContent='Discuter';b.onclick=()=>{peer=u.username;$('conversation').textContent='Discussion avec '+u.name;loadMessages()};d.append(label,b);$('people').append(d)}}
function addMessage(from,text){const d=document.createElement('div');d.textContent=(from===me?'Moi':from)+' : '+text;$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight}async function loadMessages(){try{const r=await api('/api/history',{peer});$('messages').replaceChildren();r.messages.forEach(m=>addMessage(m.sender,m.text))}catch(e){$('callStatus').textContent=e.message}}$('send').onclick=()=>{const text=$('message').value.trim();if(!peer||!text)return;send({type:'chat',to:peer,text});addMessage(me,text);$('message').value=''};
async function createPeer(mode){callMode=mode;localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==='video'});$('localVideo').srcObject=localStream;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.relay.metered.ca:80'},{urls:'turn:global.relay.metered.ca:80',username:'55c4f8f8b7e96440c81d0aef',credential:'JPX0YlXs12EmOxPm'},{urls:'turn:global.relay.metered.ca:443',username:'55c4f8f8b7e96440c81d0aef',credential:'JPX0YlXs12EmOxPm'},{urls:'turns:global.relay.metered.ca:443?transport=tcp',username:'55c4f8f8b7e96440c81d0aef',credential:'JPX0YlXs12EmOxPm'}]});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>{const v=$('remoteVideo');v.srcObject=e.streams[0];v.play().catch(()=>{document.addEventListener('click',()=>v.play(),{once:true})})};pc.onicecandidate=e=>{if(e.candidate)send({type:'signal',to:peer,action:'ice',candidate:e.candidate})};pc.onconnectionstatechange=()=>{$('callStatus').textContent='Appel : '+pc.connectionState};}
async function startCall(mode){if(!peer)return alert('Sélectionner un contact');try{await createPeer(mode);callId=crypto.randomUUID();const offer=await pc.createOffer();await pc.setLocalDescription(offer);ringStart(440);send({type:'signal',to:peer,action:'offer',sdp:pc.localDescription,mode,callId});$('callStatus').textContent='Appel en cours…'}catch(e){$('callStatus').textContent=e.message;hangup(false)}}$('audio').onclick=()=>startCall('audio');$('video').onclick=()=>startCall('video');
async function signal(m){try{if(m.action==='offer'){if(pc){send({type:'signal',to:m.from,action:'busy'});return}peer=m.from;callId=m.callId;const accept=await askCall(m);if(!accept){send({type:'signal',to:peer,action:'reject'});return}await createPeer(m.mode);await pc.setRemoteDescription(m.sdp);for(const c of (window.iceQ||[]))await pc.addIceCandidate(c);window.iceQ=[];const answer=await pc.createAnswer();await pc.setLocalDescription(answer);send({type:'signal',to:peer,action:'answer',sdp:pc.localDescription});$('callStatus').textContent='Appel accepté'}else if(m.action==='answer'&&pc){ringStop();await pc.setRemoteDescription(m.sdp);for(const c of (window.iceQ||[]))await pc.addIceCandidate(c);window.iceQ=[];}else if(m.action==='ice'){if(pc&&pc.remoteDescription){await pc.addIceCandidate(m.candidate)}else{(window.iceQ=window.iceQ||[]).push(m.candidate)}}else if(['reject','hangup','busy'].includes(m.action)){hangup(false);$('callStatus').textContent='Appel terminé : '+m.action}}catch(e){$('callStatus').textContent=e.message}}
function hangup(notify=true){if(ringResolve)ringResolve(false);ringStop();if(notify&&peer)send({type:'signal',to:peer,action:'hangup'});pc?.close();pc=null;window.iceQ=[];localStream?.getTracks().forEach(t=>t.stop());localStream=null;$('localVideo').srcObject=null;$('remoteVideo').srcObject=null;$('callStatus').textContent='Appel terminé'}$('hangup').onclick=()=>hangup();$('logout').onclick=()=>{token='';try{localStorage.removeItem('mc_tok')}catch(e){}ws?.close();hangup(false);$('app').classList.add('hidden');$('auth').classList.remove('hidden');setStatus('Déconnecté')};

let ringCtx,ringTimer,ringResolve=null;
function ringStart(fq){ringStop();try{ringCtx=new (window.AudioContext||window.webkitAudioContext)();ringCtx.resume();const beep=()=>{const o=ringCtx.createOscillator(),g=ringCtx.createGain();o.frequency.value=fq||620;g.gain.value=0.3;o.connect(g);g.connect(ringCtx.destination);o.start();o.stop(ringCtx.currentTime+1);if(!fq&&navigator.vibrate)navigator.vibrate([800,400,800])};beep();ringTimer=setInterval(beep,3000)}catch(e){}}
function ringStop(){clearInterval(ringTimer);try{ringCtx&&ringCtx.close()}catch(e){}ringCtx=null;try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
function askCall(m){return new Promise(res=>{let d=document.getElementById('incoming');if(!d){d=document.createElement('div');d.id='incoming';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;z-index:9999;font:22px sans-serif';document.body.appendChild(d)}
d.innerHTML='<div id="inTxt"></div><div style="display:flex;gap:40px"><button id="inAcc" style="background:#25d366;color:#fff;border:0;border-radius:50%;width:90px;height:90px;font-size:16px">Accepter</button><button id="inRej" style="background:#e53935;color:#fff;border:0;border-radius:50%;width:90px;height:90px;font-size:16px">Refuser</button></div>';
document.getElementById('inTxt').textContent='Appel '+(m.mode==='audio'?'audio':'vidéo')+' de @'+m.from;d.style.display='flex';ringStart();
const done=v=>{ringResolve=null;ringStop();d.style.display='none';res(v)};ringResolve=done;
document.getElementById('inAcc').onclick=()=>done(true);document.getElementById('inRej').onclick=()=>done(false)})}

(()=>{const i=document.querySelector('#auth input');if(i&&location.protocol==='https:'){i.value=location.origin;i.style.display='none';i.dispatchEvent(new Event('input'))}})();

try{const pu=document.getElementById('username');if(pu&&localStorage.getItem('mc_me'))pu.value=localStorage.getItem('mc_me');if(localStorage.getItem('mc_tok')){token=localStorage.getItem('mc_tok');me=localStorage.getItem('mc_me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');setStatus('Connecté : @'+me);connect()}}catch(e){}
</script></body></html>
